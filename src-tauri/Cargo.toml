[package]
name = "openvibe"
version = "1.1.0-beta.1"
description = "OpenVibe: a local-first canvas of real terminals for AI coding agents"
authors = ["Mathieu Kerbel"]
license = "MIT"
repository = "https://github.com/Mideky-hub/openvibe"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openvibe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "8.0.6"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9.0"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tiny_http = "0.12"
tauri-plugin-log = "2"
log = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "~2.13"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
